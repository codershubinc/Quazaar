name: Go

on:
    push:
        branches: ["main"]
        tags:
            - "v*"
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.25"

            - name: Build
              run: go build -v ./...

            - name: Test
              run: go test -v ./...

    release:
        needs: build
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.25"

            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libgtk-3-dev libappindicator3-dev

            - name: Build Linux
              run: |
                  CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -o quazaar-linux-amd64 cmd/server/main.go

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  files: |
                      quazaar-linux-amd64
                  draft: false
                  prerelease: false
                  generate_release_notes: true
